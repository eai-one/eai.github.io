<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/assets/css/styles.css">
  {% feed_meta %}
  <link rel="alternate" type="application/feed+json" title="{{ site.title }} - JSON Feed"
    href="{{ site.url }}/feed.json" />
  {% seo %}
  {% if site.google_analytics -%}
  <!-- Begin Google Analytics -->
  {% include google-analytics.html %}
  <!-- End Google Analytics -->
  {%- endif %}

  <!-- Discovery links for AI agents -->
  <link rel="api-catalog" href="/.well-known/api-catalog" type="application/linkset+json">
  <link rel="alternate" type="text/markdown" title="llms.txt" href="/llms.txt">
  <link rel="alternate" type="text/markdown" title="Full blog corpus (llms-full.txt)" href="/llms-full.txt">

  <!-- Web Model Context Protocol (WebMCP) -->
  <!-- Spec: https://webmachinelearning.github.io/webmcp/ -->
  <script>
  (function () {
    if (!('modelContext' in navigator) || !navigator.modelContext ||
        typeof navigator.modelContext.provideContext !== 'function') {
      return;
    }
    navigator.modelContext.provideContext({
      tools: [
        {
          name: 'search_blog',
          description: 'Search the EAI.1 blog (eai.one). Opens a Google site-search for the given query in a new tab.',
          inputSchema: {
            type: 'object',
            properties: {
              query: { type: 'string', description: 'Search terms.' }
            },
            required: ['query']
          },
          execute: async ({ query }) => {
            const url = 'https://www.google.com/search?q=' +
              encodeURIComponent('site:eai.one ' + query);
            window.open(url, '_blank', 'noopener');
            return { content: [{ type: 'text', text: 'Opened search for: ' + query }] };
          }
        },
        {
          name: 'list_recent_posts',
          description: 'List recent EAI.1 blog posts (title, url, date, summary) from the JSON feed.',
          inputSchema: {
            type: 'object',
            properties: {
              limit: { type: 'integer', minimum: 1, maximum: 50, default: 10 }
            }
          },
          execute: async ({ limit = 10 } = {}) => {
            const res = await fetch('/feed.json', { headers: { accept: 'application/feed+json' } });
            const feed = await res.json();
            const items = (feed.items || []).slice(0, limit).map(i => ({
              title: i.title,
              url: i.url,
              date: i.date_published,
              summary: i.summary
            }));
            return { content: [{ type: 'text', text: JSON.stringify(items, null, 2) }] };
          }
        },
        {
          name: 'get_full_corpus',
          description: 'Fetch the full text of every EAI.1 blog post as a single markdown document (llms-full.txt).',
          inputSchema: { type: 'object', properties: {} },
          execute: async () => {
            const res = await fetch('/llms-full.txt');
            const text = await res.text();
            return { content: [{ type: 'text', text }] };
          }
        },
        {
          name: 'navigate_to_post',
          description: 'Navigate the current tab to a specific EAI.1 blog post URL.',
          inputSchema: {
            type: 'object',
            properties: {
              url: { type: 'string', description: 'Absolute URL on eai.one, or a path starting with /' }
            },
            required: ['url']
          },
          execute: async ({ url }) => {
            const target = new URL(url, 'https://eai.one');
            if (target.hostname !== 'eai.one') {
              return { content: [{ type: 'text', text: 'Refused: URL is not on eai.one' }], isError: true };
            }
            window.location.href = target.toString();
            return { content: [{ type: 'text', text: 'Navigating to ' + target.toString() }] };
          }
        }
      ]
    });
  })();
  </script>
</head>
